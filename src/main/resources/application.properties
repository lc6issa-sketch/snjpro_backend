spring.application.name=snjpro_backen

# ===== DataSource MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/snjdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connexion MySQL
#spring.datasource.url=${DB_URL}
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}

#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
# Requêtes SQL non affichées dans la console (passer à true pour déboguer)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
app.jwt.secret=snj_pro_jwt_secret_key_that_is_long_enough_for_hs512_algorithm_2024_snj_mali
app.jwt.expiration-ms=86400000

# ===== Upload fichiers (Import Excel/CSV, documents, photos, pièces jointes) =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=300MB

# ===== Stockage des fichiers =====
app.stockage.dossier=uploads
# Espace alloué affiché dans « Documents » (en octets : 10 Go)
app.stockage.quota-octets=10737418240

# ===== Codes de vérification (SMS / e-mail) =====
app.otp.duree-minutes=10
app.otp.max-tentatives=5
# Aucun fournisseur SMS / e-mail n'est branché : les messages sont écrits dans les logs.
# En développement, passer à true pour recevoir aussi le code dans la réponse de l'API.
app.otp.exposer-en-reponse=false
# Lien utilisé dans les e-mails (réinitialisation du mot de passe, invitation)
app.frontend.url=http://localhost:4200

# ===== Swagger / SpringDoc =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ===== Serveur =====
server.port=8080
#server.port=${PORT:8080}

# ===== Logging =====
logging.level.com.example.snjpro_backend=INFO
logging.level.org.springframework.security=WARN
